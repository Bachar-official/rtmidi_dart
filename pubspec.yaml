name: rtmidi_dart
description: Dart FFI bindings for RtMidi (cross-platform MIDI I/O library).
version: 0.0.1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  code_assets: ^1.0.0
  ffi: ^2.1.0
  hooks: ^1.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.17.3
  path: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  ffigen: ^12.0.0
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiNativeAssets: true
      ios:
        ffiNativeAssets: true
      windows:
        ffiNativeAssets: true
      linux:
        ffiNativeAssets: true
      macos:
        ffiNativeAssets: true

ffigen:
  name: RtMidiFFI
  description: Generated bindings for RtMidi
  output: lib/src/bindings.dart
  headers:
    entry-points:
      - /usr/include/rtmidi/rtmidi_c.h
  llvm-path:
    - /usr/lib/llvm-18